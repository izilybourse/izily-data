name: update-funds
on:
  schedule: [{cron: "0 5 * * *"}]   # tous les jours à 05:00 UTC
  workflow_dispatch:
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pdfplumber
      - run: python scripts/update_funds.py
      - run: |
          git config user.name "izily-bot"; git config user.email "bot@users.noreply.github.com"
          git add data; git diff --cached --quiet || (git commit -m "maj funds.json" && git push)
